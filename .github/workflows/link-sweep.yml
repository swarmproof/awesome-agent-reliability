# Scheduled weekly dead-link sweep (TEST-PLAN.md §2b): catches rot introduced by
# the outside world, not by a PR. Opens an issue listing newly-dead links to fix
# promptly (not deferred to the monthly curation refresh — a dead link is fixed on
# sight). Weekly because it's near-zero cost and shrinks the worst-case rot window
# from ~30 days to ~7; the human curation pipeline stays monthly.

name: link-sweep

on:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: full dead-link sweep
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md docs/ CONTRIBUTING.md
          output: ./lychee-report.md
          fail: false

      - name: open issue if links are dead
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Weekly link sweep: dead links found'
          content-filepath: ./lychee-report.md
          labels: link-rot
